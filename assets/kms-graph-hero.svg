  <g class="t lbl">
    <text x="140" y="222">인사</text>
    <text x="356" y="292">채용</text>
    <text x="574" y="66">영업</text>
    <text x="762" y="258">총무</text>
    <text x="1004" y="230">경영</text>
  </g>

  <text class="t" x="600" y="342" text-anchor="middle" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1">KMS Graph</text>
</svg>
