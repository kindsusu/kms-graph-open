    <circle cx="330" cy="215" r="11"/><circle cx="385" cy="175" r="14"/><circle cx="445" cy="205" r="10"/><circle cx="420" cy="265" r="9"/><circle cx="400" cy="120" r="9"/>
    <circle cx="540" cy="95" r="11"/><circle cx="610" cy="80" r="10"/><circle cx="660" cy="130" r="16"/><circle cx="620" cy="180" r="10"/><circle cx="560" cy="160" r="9"/>
    <circle cx="720" cy="225" r="10"/><circle cx="780" cy="200" r="13"/><circle cx="850" cy="225" r="10"/><circle cx="890" cy="190" r="12"/><circle cx="760" cy="120" r="9"/>
    <circle cx="960" cy="110" r="10"/><circle cx="1020" cy="85" r="13"/><circle cx="1075" cy="140" r="10"/><circle cx="1040" cy="195" r="11"/><circle cx="975" cy="175" r="9"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="110" cy="150" r="3.2"/><circle cx="165" cy="105" r="2.4"/><circle cx="225" cy="130" r="2.4"/><circle cx="200" cy="190" r="2.8"/><circle cx="280" cy="100" r="2"/>
    <circle cx="330" cy="215" r="2.4"/><circle cx="385" cy="175" r="3.2"/><circle cx="445" cy="205" r="2.2"/><circle cx="420" cy="265" r="2"/><circle cx="400" cy="120" r="2"/>
    <circle cx="540" cy="95" r="2.4"/><circle cx="610" cy="80" r="2.2"/><circle cx="660" cy="130" r="3.6"/><circle cx="620" cy="180" r="2.2"/><circle cx="560" cy="160" r="2"/>
    <circle cx="720" cy="225" r="2.2"/><circle cx="780" cy="200" r="3"/><circle cx="850" cy="225" r="2.2"/><circle cx="890" cy="190" r="2.8"/><circle cx="760" cy="120" r="2"/>
    <circle cx="960" cy="110" r="2.2"/><circle cx="1020" cy="85" r="3"/><circle cx="1075" cy="140" r="2.2"/><circle cx="1040" cy="195" r="2.4"/><circle cx="975" cy="175" r="2"/>
